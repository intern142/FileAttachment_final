version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/storage
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/invoices
      STORAGE_PATH: /storage
      SECRET_KEY: dev-secret-change-me
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --reload
volumes:
  pgdata: {}