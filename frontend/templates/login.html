{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Login</h1>
        
        <form 
            hx-post="/auth/login" 
            hx-target="#result" 
            hx-swap="innerHTML"
            hx-indicator="#loader"
            class="space-y-4"
            id="loginForm"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="username" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div id="result" class="mt-2"></div>
            
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium"
            >
                <span id="loader" class="htmx-indicator inline-block animate-spin rounded-full h-5 w-5 border-b-2 border-white mr-2"></span>
                Login
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-blue-600 hover:text-blue-800">Register</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('htmx:afterRequest', function(evt) {
    if (evt.detail.successful) {
        let resp = evt.detail.xhr.response;
        try { resp = JSON.parse(resp); } catch (e) { resp = null; }
        if (resp && resp.access_token) {
            localStorage.setItem('access_token', resp.access_token);
            // Also set cookie for full page navigation
            document.cookie = 'access_token=' + resp.access_token + '; path=/; max-age=1800; SameSite=Lax';
            window.location.href = '/';
        }
    } else if (evt.detail.xhr.status === 401 || evt.detail.xhr.status === 422) {
        let resp = evt.detail.xhr.response;
        try { resp = JSON.parse(resp); } catch (e) { resp = null; }
        if (resp && resp.detail) {
            document.getElementById('result').innerHTML = '<div class="text-red-600 text-sm mt-2">' + resp.detail + '</div>';
        }
    }
});
</script>
{% endblock %}
