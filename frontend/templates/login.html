{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-md">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login</h1>
        
        <form 
            hx-post="/auth/login" 
            hx-target="#result" 
            hx-swap="innerHTML"
            class="space-y-4"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input 
                    type="email" 
                    name="username" 
                    required 
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                >
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium"
            >
                Login
            </button>
        </form>
        
        <div id="result" class="mt-4"></div>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Don't have an account? <a href="/register" class="text-blue-600 hover:text-blue-800">Register</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target.id === 'result') {
            if (evt.detail.xhr.status === 200) {
                try {
                    const response = JSON.parse(evt.detail.xhr.responseText);
                    if (response.access_token) {
                        localStorage.setItem('access_token', response.access_token);
                        window.location.href = '/invoices';
                    }
                } catch (e) {
                    // Not JSON, show response as is
                }
            } else if (evt.detail.xhr.status >= 400) {
                try {
                    const response = JSON.parse(evt.detail.xhr.responseText);
                    const message = response.detail || 'Login failed';
                    evt.detail.target.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">' + message + '</div>';
                } catch (e) {
                    evt.detail.target.innerHTML = '<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">Login failed. Please try again.</div>';
                }
            }
        }
    });
</script>
{% endblock %}
