{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-4xl">
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Review Invoice</h1>
            <a href="/upload" class="text-blue-600 hover:text-blue-800">← Back to Upload</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-gray-700">Invoice Preview</h2>
                <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 min-h-[400px]">
                    {% set ext = filename.split('.')[-1].lower() %}
                    {% if ext == 'pdf' %}
                        <iframe 
                            src="/temp/{{ job_id }}_{{ filename }}" 
                            class="w-full h-full min-h-[400px] border-0"
                        ></iframe>
                    {% else %}
                        <img 
                            src="/temp/{{ job_id }}_{{ filename }}" 
                            alt="Invoice preview"
                            class="w-full h-auto max-h-[400px] object-contain"
                        >
                    {% endif %}
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-lg font-semibold text-gray-700">Extracted Data</h2>
                
                <form 
                    hx-post="/api/confirm" 
                    hx-target="#confirm-result" 
                    hx-swap="innerHTML"
                    hx-indicator="#confirm-loader"
                    class="space-y-4"
                >
                    <input type="hidden" name="job_id" value="{{ job_id }}">
                    <input type="hidden" name="filename" value="{{ filename }}">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Contractor *</label>
                        <select name="contractor_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Select contractor</option>
                            {% for c in contractors %}
                            <option value="{{ c.id }}" {% if parsed.contractor and c.name.lower() in parsed.contractor.lower() %}selected{% endif %}>
                                {{ c.name }} ({{ c.short_code }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Source *</label>
                        <select name="source_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Select source</option>
                            {% for s in sources %}
                            <option value="{{ s.id }}" {% if parsed.source and s.name.lower() in parsed.source.lower() %}selected{% endif %}>
                                {{ s.name }} ({{ s.short_code }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                        <input 
                            type="date" 
                            name="date" 
                            required 
                            value="{{ parsed.date if parsed.date else '' }}"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        >
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Amount *</label>
                        <input 
                            type="text" 
                            name="amount" 
                            required 
                            placeholder="e.g., 1500.00"
                            value="{{ parsed.amount if parsed.amount else '' }}"
                            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        >
                    </div>

                    <div class="pt-4 border-t border-gray-200">
                        <button 
                            type="submit" 
                            class="w-full bg-green-600 text-white py-3 px-4 rounded-lg hover:bg-green-700 transition-colors font-medium"
                        >
                            Confirm & Save
                        </button>
                        
                        <div id="confirm-loader" class="htmx-indicator text-center py-2">
                            <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-white"></div>
                        </div>
                    </div>
                </form>

                <div id="confirm-result" class="mt-4"></div>
            </div>
        </div>

        <details class="mt-6">
            <summary class="cursor-pointer text-sm text-gray-500 hover:text-gray-700">Raw OCR Text</summary>
            <pre class="mt-2 p-4 bg-gray-100 rounded-lg text-sm text-gray-700 whitespace-pre-wrap max-h-64 overflow-auto">{{ ocr_text }}</pre>
        </details>
    </div>
</div>
{% endblock %}
