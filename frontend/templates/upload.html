{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Upload Invoice</h1>
        
        <form 
            hx-post="/api/upload" 
            hx-target="#result" 
            hx-swap="innerHTML"
            hx-indicator="#loader"
            enctype="multipart/form-data"
            class="space-y-4"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Select Invoice Image or PDF
                </label>
                <div 
                    class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors"
                    id="dropzone"
                >
                    <input 
                        type="file" 
                        name="file" 
                        accept="image/*,application/pdf" 
                        required
                        class="hidden" 
                        id="file-input"
                        hx-on:change="document.getElementById('file-name').textContent = this.files[0]?.name || ''"
                    >
                    <label for="file-input" class="cursor-pointer">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                        <p class="mt-2 text-gray-600">Drag & drop or click to browse</p>
                        <p class="text-sm text-gray-500">JPG, PNG, PDF (max 10MB)</p>
                    </label>
                </div>
                <p id="file-name" class="mt-2 text-sm text-gray-500 hidden"></p>
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium"
                disabled
            >
                Upload & Extract
            </button>
            
            <div id="loader" class="htmx-indicator text-center py-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-2 text-gray-600">Running OCR...</p>
            </div>
        </form>
        
        <div id="result" class="mt-6"></div>
    </div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('file-name');
    const submitBtn = dropzone.closest('form').querySelector('button[type="submit"]');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
        dropzone.classList.add('border-blue-500', 'bg-blue-50');
    }

    function unhighlight() {
        dropzone.classList.remove('border-blue-500', 'bg-blue-50');
    }

    dropzone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        fileInput.files = files;
        fileName.textContent = files[0]?.name || '';
        fileName.classList.remove('hidden');
        submitBtn.disabled = false;
    }

    fileInput.addEventListener('change', function() {
        fileName.textContent = this.files[0]?.name || '';
        fileName.classList.toggle('hidden', !this.files[0]);
        submitBtn.disabled = !this.files[0];
    });
</script>
{% endblock %}
