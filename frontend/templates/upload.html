{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <div class="bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Upload Invoice</h1>
        
            <form
                id="upload-form"
                hx-post="/api/upload"
                hx-target="#result"
                hx-swap="none"
            hx-indicator="#loader"
            enctype="multipart/form-data"
            class="space-y-4"
        >
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Select Invoice Image or PDF
                </label>
                <div 
                    class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors"
                    id="dropzone"
                >
                    <input 
                        type="file" 
                        name="file" 
                        accept="image/*,application/pdf" 
                        required
                        class="hidden" 
                        id="file-input"
                        hx-on:change="document.getElementById('file-name').textContent = this.files[0]?.name || ''"
                    >
                    <label for="file-input" class="cursor-pointer">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                        <p class="mt-2 text-gray-600">Drag & drop or click to browse</p>
                        <p class="text-sm text-gray-500">JPG, PNG, PDF (max 10MB)</p>
                    </label>
                </div>
                <p id="file-name" class="mt-2 text-sm text-gray-500 hidden"></p>
            </div>
            
            <button 
                type="submit" 
                class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 transition-colors font-medium"
                disabled
            >
                Upload & Extract
            </button>
            
            <div id="loader" class="htmx-indicator text-center py-4">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                <p class="mt-2 text-gray-600">Running OCR...</p>
            </div>
        </form>
        
        <div id="result" class="mt-6"></div>
    </div>
</div>

<div id="uploadRenameModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <h3 class="text-lg font-medium text-gray-900 mb-4">Rename Invoice</h3>
        <form id="uploadRenameForm" class="space-y-4">
            <input type="hidden" id="uploadRenameJobId">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contractor *</label>
                <input type="text" id="uploadRenameContractor" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Purchased From *</label>
                <input type="text" id="uploadRenamePurchasedFrom" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                <input type="date" id="uploadRenameDate" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
            </div>
            <div id="uploadRenameError" class="text-red-600 text-sm hidden"></div>
            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" onclick="closeUploadRename()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 text-sm">Rename</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openUploadRename(jobId, contractor, purchasedFrom, date) {
        document.getElementById('uploadRenameJobId').value = jobId;
        document.getElementById('uploadRenameContractor').value = contractor.startsWith('unknown') ? '' : contractor;
        document.getElementById('uploadRenamePurchasedFrom').value = purchasedFrom.startsWith('unknown') ? '' : purchasedFrom;
        document.getElementById('uploadRenameDate').value = date && date !== 'unknown_date' ? date : '';
        document.getElementById('uploadRenameError').classList.add('hidden');
        document.getElementById('uploadRenameModal').classList.remove('hidden');
    }
    function closeUploadRename() {
        document.getElementById('uploadRenameModal').classList.add('hidden');
    }
    document.getElementById('uploadRenameForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const jobId = document.getElementById('uploadRenameJobId').value;
        const formData = new FormData();
        formData.append('contractor', document.getElementById('uploadRenameContractor').value);
        formData.append('purchased_from', document.getElementById('uploadRenamePurchasedFrom').value);
        formData.append('date', document.getElementById('uploadRenameDate').value);
        try {
            const resp = await fetch(`/api/upload/${jobId}/rename`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') },
                body: formData
            });
            if (resp.ok) {
                const data = await resp.json();
                document.getElementById('uploaded-filename').textContent = data.generated_filename;
                closeUploadRename();
            } else {
                const err = await resp.json();
                document.getElementById('uploadRenameError').textContent = err.detail || 'Rename failed';
                document.getElementById('uploadRenameError').classList.remove('hidden');
            }
        } catch (err) {
            document.getElementById('uploadRenameError').textContent = 'Network error: ' + err.message;
            document.getElementById('uploadRenameError').classList.remove('hidden');
        }
    });
    async function deleteUpload(jobId) {
        if (!confirm('Delete this upload?')) return;
        try {
            const resp = await fetch(`/api/upload/${jobId}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') }
            });
            if (resp.ok) {
                document.getElementById('result').innerHTML = '';
            } else {
                alert('Failed to delete');
            }
        } catch (err) {
            alert('Error: ' + err.message);
        }
    }
</script>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const fileName = document.getElementById('file-name');
    const submitBtn = dropzone.closest('form').querySelector('button[type="submit"]');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, unhighlight, false);
    })

    function highlight() {
        dropzone.classList.add('border-blue-500', 'bg-blue-50');
    }

    function unhighlight() {
        dropzone.classList.remove('border-blue-500', 'bg-blue-50');
    }

    dropzone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        fileInput.files = files;
        fileName.textContent = files[0]?.name || '';
        fileName.classList.remove('hidden');
        submitBtn.disabled = false;
    }

    fileInput.addEventListener('change', function() {
        fileName.textContent = this.files[0]?.name || '';
        fileName.classList.toggle('hidden', !this.files[0]);
        submitBtn.disabled = !this.files[0];
    });

    // Format upload result
    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.elt && evt.detail.elt.id === 'upload-form' && evt.detail.successful) {
            try {
                const resp = JSON.parse(evt.detail.xhr.response);
                if (resp.generated_filename) {
                    const contractor = resp.extracted?.contractor || '';
                    const purchasedFrom = resp.extracted?.purchased_from || '';
                    const date = resp.extracted?.date || '';
                    const html = `
                        <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                            <h3 class="text-lg font-semibold text-green-800 mb-2">Upload Successful!</h3>
                            <div class="text-sm text-gray-700">
                                <strong>Renamed Invoice:</strong>
                                <code id="uploaded-filename" class="bg-gray-100 px-2 py-1 rounded font-mono">${resp.generated_filename}</code>
                            </div>
                            <div class="flex gap-2 mt-4">
                                <a href="/review/${resp.job_id}" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">Review</a>
                                <button type="button" onclick="openUploadRename('${resp.job_id}', '${contractor}', '${purchasedFrom}', '${date}')" class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700 text-sm">Rename</button>
                                <button type="button" onclick="deleteUpload('${resp.job_id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 text-sm">Delete</button>
                            </div>
                        </div>
                    `;
                    document.getElementById('result').innerHTML = html;
                }
            } catch (e) {
                console.error('Error parsing upload response:', e);
            }
        }
    });
</script>
{% endblock %}
