<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Invoice Manager{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dropzone { border: 2px dashed #ccc; border-radius: 8px; padding: 40px; text-align: center; transition: all 0.3s; }
        .dropzone.dragover { border-color: #0d6efd; background-color: #f0f7ff; }
        .dropzone.dragover .dropzone-text { color: #0d6efd; }
        .preview-img { max-width: 100%; max-height: 400px; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .table th { white-space: nowrap; }
        .badge-status { font-size: 0.75rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Invoice Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Upload</a>
                <a class="nav-link" href="/invoices">Invoices</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        document.body.addEventListener('htmx:configRequest', function(evt) {
            const token = localStorage.getItem('access_token');
            if (token) {
                evt.detail.headers['Authorization'] = 'Bearer ' + token;
            }
        });
    </script>
</body>
</html>
