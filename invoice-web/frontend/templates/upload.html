{% extends "base.html" %}

{% block title %}Upload Invoice - Invoice Manager{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Upload Invoice</h4>
            </div>
            <div class="card-body">
                <div class="dropzone" id="dropzone">
                    <input type="file" id="fileInput" name="file" accept="image/*,.pdf" hidden>
                    <div class="dropzone-text">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-cloud-upload mb-3" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383zm.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
                            <path fill-rule="evenodd" d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/>
                        </svg>
                        <p class="mb-1"><strong>Drag & drop</strong> an invoice image or PDF here</p>
                        <p class="text-muted mb-0">or click to browse</p>
                    </div>
                </div>
                <div id="preview" class="mt-3" style="display: none;">
                    <img id="previewImg" class="preview-img">
                    <div class="mt-2 text-muted small">Selected: <span id="fileName"></span></div>
                </div>
                <div class="mt-3">
                    <button id="uploadBtn" class="btn btn-primary w-100" disabled>
                        <span class="spinner-border spinner-border-sm me-2" role="status" style="display: none;"></span>
                        <span id="btnText">Upload & Extract</span>
                    </button>
                </div>
                <div id="error" class="alert alert-danger mt-3" style="display: none;"></div>
                <div id="success" class="alert alert-success mt-3" style="display: none;"></div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">Extracted Files</h5>
            </div>
            <div class="card-body">
                <div id="extractedFiles">
                    <p class="text-muted mb-0">No files extracted yet.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const fileName = document.getElementById('fileName');
const uploadBtn = document.getElementById('uploadBtn');
const btnText = document.getElementById('btnText');
const error = document.getElementById('error');
const success = document.getElementById('success');
const extractedFilesBox = document.getElementById('extractedFiles');
let selectedFile = null;

function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

function fileItemHtml(f) {
    const downloadUrl = '/api/extracted-file?path=' + encodeURIComponent(f.path || '');
    return `
    <div class="card mb-2">
        <div class="card-body py-2 px-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <div class="fw-semibold mb-0">${escapeHtml(f.filename)}</div>
                <div class="small text-muted">
                    ${escapeHtml(f.contractor || '')}${f.contractor && f.purchased_from ? ' &rarr; ' : ''}${escapeHtml(f.purchased_from || '')}${f.date ? ' &middot; ' + escapeHtml(f.date) : ''}
                </div>
            </div>
            <a class="btn btn-sm btn-outline-primary" href="${downloadUrl}">Download</a>
        </div>
    </div>`;
}

function renderExtractedFiles(files) {
    if (!files || !files.length) {
        extractedFilesBox.innerHTML = '<p class="text-muted mb-0">No files extracted yet.</p>';
        return;
    }
    extractedFilesBox.innerHTML = files.map(fileItemHtml).join('');
}

async function loadExtractedFiles() {
    try {
        const res = await fetch('/api/extracted-files', {
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') }
        });
        if (!res.ok) return;
        renderExtractedFiles(await res.json());
    } catch (err) {
        console.error('Failed to load extracted files:', err);
    }
}

function resetFileSelection() {
    selectedFile = null;
    fileName.textContent = '';
    preview.style.display = 'none';
    uploadBtn.disabled = true;
    btnText.textContent = 'Upload & Extract';
    uploadBtn.querySelector('.spinner-border').style.display = 'none';
}

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => { if (e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file) {
    if (!file.type.startsWith('image/') && file.type !== 'application/pdf') {
        showError('Please select an image or PDF file');
        return;
    }
    if (file.size > 10 * 1024 * 1024) {
        showError('File size must be less than 10MB');
        return;
    }
    selectedFile = file;
    fileName.textContent = file.name;
    if (file.type.startsWith('image/')) {
        previewImg.src = URL.createObjectURL(file);
        preview.style.display = 'block';
    } else {
        preview.style.display = 'none';
    }
    uploadBtn.disabled = false;
    hideError();
    success.style.display = 'none';
}

function showError(msg) { error.textContent = msg; error.style.display = 'block'; }
function hideError() { error.style.display = 'none'; }

uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    uploadBtn.disabled = true;
    btnText.textContent = 'Processing...';
    uploadBtn.querySelector('.spinner-border').style.display = 'inline-block';
    hideError();
    success.style.display = 'none';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + localStorage.getItem('access_token') },
            body: formData
        });
        const data = await response.json();
        if (!response.ok) {
            const detail = typeof data.detail === 'string' ? data.detail : 'Upload failed';
            throw new Error(detail);
        }
        success.textContent = 'Invoice processed successfully';
        success.style.display = 'block';
        resetFileSelection();
        loadExtractedFiles();
    } catch (err) {
        showError(err.message);
        uploadBtn.disabled = false;
        btnText.textContent = 'Upload & Extract';
        uploadBtn.querySelector('.spinner-border').style.display = 'none';
    }
});

document.addEventListener('DOMContentLoaded', loadExtractedFiles);
</script>
{% endblock %}
